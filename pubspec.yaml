name: book_reader_app
description: "کتابخوان آفلاین PDF و EPUB - Paper & Glass"
publish_to: 'none'
version: 0.1.1+2

environment:
  # flutter_widget_from_html_core حداقل Dart 3.4 و Flutter 3.22 می‌خواهد
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # سبک و کم‌حجم — بدون syncfusion سنگین

  epub_plus: ^5.1.0
  flutter_riverpod: ^2.5.1
  flutter_tts: ^4.0.2
  file_picker: ^13.1.0
  html: ^0.15.4
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  flutter_widget_from_html_core: ^0.16.1
  pdfrx: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# دو override لازم است و هر دو بررسی شده‌اند، نه حدس:
#
# image — epub_plus 5.1.0 روی image ^3.0.8 قفل شده، ولی کد pdfrx_engine با API
#   نسخه ۴ نوشته شده و با نسخه ۳ اصلاً کامپایل نمی‌شود. همچنین نسخه‌های ۴.۷
#   به بالای image روی archive 4 می‌نشینند.
#
# archive — epub_plus روی archive ^3 و pdfrx_engine 0.4.6 به بالا روی archive 4
#   قفل شده‌اند، پس بدون override هیچ نسخه‌ای از pdfrx با این پروژه قابل
#   استفاده نیست. تنها API که epub_plus از archive صدا می‌زند
#   ZipDecoder().decodeBytes است که در نسخه ۴ هم هست، و تست‌های EPUB پروژه
#   هم آن را پوشش می‌دهند.
dependency_overrides:
  image: 4.8.0
  archive: 4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/en_fa.json
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
