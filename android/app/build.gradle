import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ── کلید امضا ──
// کلید انتشار از android/key.properties خوانده می‌شود که در git نیست.
// اگر نبود، بیلد با کلید debug انجام می‌شود ولی هشدار واضح چاپ می‌شود، چون
// چنین بیلدی در فروشگاه قابل انتشار نیست و می‌تواند جایگزین شود.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseKey = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
            .every { keystoreProperties.containsKey(it) }
}

android {
    lint {
        // lint باید شکست بیلد بدهد، نه اینکه بی‌سروصدا رد شود
        checkReleaseBuilds true
        abortOnError true
        // مسائل بی‌اهمیت ظاهری نباید جلوی انتشار را بگیرند
        disable 'OldTargetApi', 'GradleDependency', 'MissingTranslation'
    }
    namespace = "com.bookreader.book_reader_app"
    // نسخه SDK از خود Flutter خوانده می‌شود (۳۶ در Flutter 3.47.5).
    // قبلاً دستی روی ۳۶ بود و با AGP 8.1 ناسازگار، ولی حالا نسخه
    // ابزار خودش از آن پشتیبانی می‌کند.
    compileSdk = flutter.compileSdkVersion
    // NDK روی نسخه نصب‌شده ثابت شده. نسخه پیشنهادی Flutter (28.2)
    // از dl.google.com روی این شبکه قابل دانلود نیست و 25.2 برای
    // کامپایل بومی پلاگین‌ها کافی است.
    ndkVersion = "25.2.9519653"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.bookreader.book_reader_app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // فارسی در برخی دستگاه‌ها بدون این می‌تواند اعداد را لاتین نشان دهد
        resourceConfigurations += ["fa", "en"]
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                // فقط وقتی ورودی واقعاً URI است (مثل file:///C:/...) باید
                // از new URI عبور کند. مسیرهای مطلق لینوکس مثل
                // /home/runner/... مطلق‌اند ولی URI نیستند، و new
                // File(new URI(...)) روی آن‌ها با «URI is not absolute»
                // شکست می‌خورد؛ file() هر دو حالت مطلق و نسبی را پوشش
                // می‌دهد.
                def storePath = keystoreProperties["storeFile"]
                storeFile = storePath.contains("://")
                        ? new File(new URI(storePath))
                        : rootProject.file(storePath)
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKey
                    ? signingConfigs.release
                    : signingConfigs.debug

            // کوچک‌سازی و حذف منابع بلااستفاده
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"

            if (!hasReleaseKey) {
                logger.warn(
                        "\n" +
                        "╔══════════════════════════════════════════════════════════╗\n" +
                        "║  کلید امضای انتشار پیدا نشد (android/key.properties)      ║\n" +
                        "║  این بیلد با کلید debug امضا می‌شود و در فروشگاه          ║\n" +
                        "║  قابل انتشار نیست. برای ساخت نسخه نهایی، بخش             ║\n" +
                        "║  «انتشار» در README.md را دنبال کن.                       ║\n" +
                        "╚══════════════════════════════════════════════════════════╝\n")
            }
        }
    }

    // در بیلدهای release چند ABI همزمان ساخته می‌شوند. تقسیم ABI حجم
    // نصبی هر کاربر را کم می‌کند چون فقط معماری دستگاهش دانلود می‌شود.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }
}

flutter {
    source = "../.."
}
