import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ── کلید امضا ──
// کلید انتشار از android/key.properties خوانده می‌شود که در git نیست.
// اگر نبود، بیلد با کلید debug انجام می‌شود ولی هشدار واضح چاپ می‌شود، چون
// چنین بیلدی در فروشگاه قابل انتشار نیست و می‌تواند جایگزین شود.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseKey = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
            .every { keystoreProperties.containsKey(it) }
}

android {
    lint {
        // lint باید شکست بیلد بدهد، نه اینکه بی‌سروصدا رد شود
        checkReleaseBuilds true
        abortOnError true
        // مسائل بی‌اهمیت ظاهری نباید جلوی انتشار را بگیرند
        disable 'OldTargetApi', 'GradleDependency', 'MissingTranslation'
    }
    namespace = "com.bookreader.book_reader_app"
    // مقدار پایین‌تر از ۳۶ بیلد را می‌شکند: پلاگین‌های فعال خودشان
    // compileSdk بالاتر اعلام می‌کنند — flutter_tts روی ۳۶ و
    // pdfx و flutter_plugin_android_lifecycle روی ۳۵.
    //
    // نسخه ۳۶ رسماً توسط AGP 8.1 پشتیبانی نمی‌شود و اخطارش با
    // android.suppressUnsupportedCompileSdk در gradle.properties خاموش
    // می‌شود. راه درست، ارتقای زنجیره ابزار (Flutter و AGP) است؛ تا آن
    // زمان همین مقدار کار می‌کند.
    compileSdk = 36
    buildToolsVersion = "36.0.0"
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.bookreader.book_reader_app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // فارسی در برخی دستگاه‌ها بدون این می‌تواند اعداد را لاتین نشان دهد
        resourceConfigurations += ["fa", "en"]
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKey
                    ? signingConfigs.release
                    : signingConfigs.debug

            // کوچک‌سازی و حذف منابع بلااستفاده
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"

            if (!hasReleaseKey) {
                logger.warn(
                        "\n" +
                        "╔══════════════════════════════════════════════════════════╗\n" +
                        "║  کلید امضای انتشار پیدا نشد (android/key.properties)      ║\n" +
                        "║  این بیلد با کلید debug امضا می‌شود و در فروشگاه          ║\n" +
                        "║  قابل انتشار نیست. برای ساخت نسخه نهایی، بخش             ║\n" +
                        "║  «انتشار» در README.md را دنبال کن.                       ║\n" +
                        "╚══════════════════════════════════════════════════════════╝\n")
            }
        }
    }

    // در بیلدهای release چند ABI همزمان ساخته می‌شوند. تقسیم ABI حجم
    // نصبی هر کاربر را کم می‌کند چون فقط معماری دستگاهش دانلود می‌شود.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }
}

flutter {
    source = "../.."
}
